openapi: 3.0.3
info:
  title: ServiceDesk API
  version: 1.0.0
  description: REST API for the ServiceDesk repair-shop platform.
paths:
  /api/v1/appointments/:
    get:
      operationId: appointments_list
      description: |-
        Scopes every queryset to the active business.

        Lookups of records from another business behave exactly like records that
        do not exist (404), so ids from other tenants reveal nothing.
      parameters:
      - in: query
        name: customer
        schema:
          type: string
          format: uuid
      - in: query
        name: end
        schema:
          type: string
          format: date-time
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - diagnosis
          - drop_off
          - pickup
          - repair
        description: |-
          * `drop_off` - Device drop-off
          * `diagnosis` - Diagnosis
          * `repair` - Repair
          * `pickup` - Pickup
      - in: query
        name: order
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date-time
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - no_show
          - scheduled
        description: |-
          * `scheduled` - Scheduled
          * `completed` - Completed
          * `cancelled` - Cancelled
          * `no_show` - No-show
      - in: query
        name: technician
        schema:
          type: string
          format: uuid
      tags:
      - appointments
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
          description: ''
    post:
      operationId: appointments_create
      description: |-
        Scopes every queryset to the active business.

        Lookups of records from another business behave exactly like records that
        do not exist (404), so ids from other tenants reveal nothing.
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/{public_id}/:
    get:
      operationId: appointments_retrieve
      description: |-
        Scopes every queryset to the active business.

        Lookups of records from another business behave exactly like records that
