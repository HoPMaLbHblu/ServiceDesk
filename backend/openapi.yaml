components:
  schemas:
    ActionEnum:
      enum:
      - activate
      - payment_failed
      - payment_succeeded
      - cancel
      type: string
      description: |-
        * `activate` - activate
        * `payment_failed` - payment_failed
        * `payment_succeeded` - payment_succeeded
        * `cancel` - cancel
    ActiveWorkspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
        timezone:
          type: string
        currency:
          type: string
      required:
      - currency
      - id
      - name
