          format: date-time
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - no_show
          - scheduled
        description: |-
          * `scheduled` - Scheduled
          * `completed` - Completed
          * `cancelled` - Cancelled
          * `no_show` - No-show
      - in: query
