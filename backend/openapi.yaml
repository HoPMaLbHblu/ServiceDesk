      - in: query
        name: duration_minutes
        schema:
          type: integer
          maximum: 480
          minimum: 15
          default: 60
      - in: query
        name: end
        schema:
          type: string
          format: date-time
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - diagnosis
          - drop_off
          - pickup
          - repair
        description: |-
          * `drop_off` - Device drop-off
          * `diagnosis` - Diagnosis
          * `repair` - Repair
          * `pickup` - Pickup
      - in: query
        name: order
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: start
        schema:
