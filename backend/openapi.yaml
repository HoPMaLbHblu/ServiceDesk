      description: Read-only. There is no endpoint that changes audit records.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: action__startswith
        schema:
          type: string
      - in: query
        name: created_at__date__gte
        schema:
          type: string
          format: date
      - in: query
        name: created_at__date__lte
        schema:
          type: string
          format: date
      - in: query
        name: entity_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
